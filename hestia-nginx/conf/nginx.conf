# ============================================================
# 云筑 Hestia · 智慧社区设施运维平台
# Nginx 部署配置：静态资源 + 接口反向代理 + WebSocket
# ============================================================

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 20m;

    # 开启压缩，前端 vendor 包较大，收益明显
    gzip              on;
    gzip_min_length   1k;
    gzip_comp_level   5;
    gzip_types        text/plain text/css application/json application/javascript
                      application/x-javascript text/xml application/xml image/svg+xml;
    gzip_vary         on;

    # WebSocket 升级头
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream hestia_server {
        server 127.0.0.1:8080;
        keepalive 32;
    }

    server {
        listen       80;
        server_name  localhost;

        # index.html 禁止缓存：前端发版后浏览器必须拿到最新的资源引用，
        # 否则会继续加载被 30 天强缓存的旧 app.js，导致修复不生效。
        location = /index.html {
            root   html/hestia;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # ---------- 住户端 H5（uni-app 构建产物） ----------
        # ^~ 防止 .js/.css 被下面的静态缓存正则抢走
        location ^~ /m/ {
            root   html;
            index  index.html;
            try_files $uri $uri/ /m/index.html;
        }

        # ---------- 前端静态资源 ----------
        location / {
            root   html/hestia;
            index  index.html;
            # 前端使用 hash 路由，这里兜底历史模式也不会 404
            try_files $uri $uri/ /index.html;
        }

        # 带指纹的静态资源长缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
            root      html/hestia;
            expires   30d;
            add_header Cache-Control "public, max-age=2592000";
        }

        # ---------- 管理端接口 ----------
        location /admin/ {
            proxy_pass         http://hestia_server/admin/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout    60s;
        }

        # ---------- 住户端接口 ----------
        location /resident/ {
            proxy_pass         http://hestia_server/resident/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_connect_timeout 10s;
            proxy_read_timeout    60s;
        }

        # ---------- WebSocket 实时通知 ----------
        location /ws/ {
            proxy_pass         http://hestia_server/ws/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host       $host;
            proxy_read_timeout 3600s;
        }

        # ---------- 接口文档（开发期方便，生产可关闭） ----------
        # 1) 必须回传真实 Host（$host）：否则后端 Tomcat 收到 upstream 名
        #    hestia_server（含下划线，非法主机名）会直接返回 400
        # 2) 必须用 ^~ 前缀：否则 .js/.css 等请求会被下面的静态缓存正则
        #    location 抢走，去本地磁盘找文件导致 404
        location ^~ /doc.html {
            proxy_pass http://hestia_server/doc.html;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }
        location ^~ /webjars/ {
            proxy_pass http://hestia_server/webjars/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }
        location ^~ /swagger-resources/ {
            proxy_pass http://hestia_server/swagger-resources/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }
        location ^~ /v2/ {
            proxy_pass http://hestia_server/v2/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
